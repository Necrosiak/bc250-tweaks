# MangoHud — BC-250
#
# ⚠️ gpu_load et gpu_power sont VOLONTAIREMENT absents.
#
# Le firmware de cette puce ne mesure NI l'activité GPU NI sa consommation :
#   - gpu_busy_percent répond « operation not supported » ;
#   - average_gfx_activity (table gpu_metrics du pilote) vaut 0xFFFF, la
#     sentinelle « non supporté ». MangoHud la divise par 100 et affiche
#     655 %, un chiffre qui ne bouge JAMAIS, en jeu comme au repos ;
#   - les champs de puissance de la même table sautent de 0,9 W à 62 W sous
#     une charge CONSTANTE (le décodage est bon : la température voisine reste
#     stable et le champ CPU garde sa sentinelle — c'est le firmware qui ment).
#
# Une vraie charge GPU est disponible dans BC250-Toolkit (onglet Ressources),
# calculée depuis les compteurs par moteur du noyau (drm-engine-gfx / fdinfo),
# la méthode qu'utilise nvtop. Mesuré ici : ~58 % interface Steam seule,
# 68-75 % en jeu.
#
# cpu_load, lui, est bien mesuré : on le garde.

no_display
legacy_layout=0
fps
frametime
gpu_temp
cpu_temp
cpu_load
ram
vram
gamemode
toggle_hud=Shift_R+F12
