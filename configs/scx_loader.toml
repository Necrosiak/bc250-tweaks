# BC-250 — configuration de scx_loader
#
# PAS de --autopower ici, et c'est délibéré.
#
# --autopower laisse scx_lavd suivre le profil d'énergie du système, et ce profil
# décide notamment de la compaction de cœurs. Dans cet état, sur BC-250 sous
# kernel 7.2.1-ogc2 avec scx-scheds 1.1.3, le noyau évinçait lavd en boucle :
#
#     sched_ext: BPF scheduler "lavd_…" disabled (runnable task stall)
#     sched_ext: lavd_… : <tâche> failed to run for 37.909s
#
# → gel de 5 à 10 secondes de toute l'interface (au même instant, des services
# systemd échouent en timeout : c'est bien tout le système qui bloque, pas
# seulement l'affichage), puis scx_loader relance lavd et le cycle recommence.
# En jeu ça ne se voit pas ; au bureau et dans gamescope, si.
#
# Mesuré le 30/08/2026 sur la BC-250 de référence (6C/12T) :
#
#   --autopower    : stalls répétés, ~toutes les 3 minutes
#   --performance  : 0 stall, et `scx_lavd --monitor` affiche
#                    « # ACT CPU 12 » (12 CPU actifs sur 12), POWER MODE
#                    performance, PERFORMANCE% 100, file d'attente vide
#
# La BC-250 est une carte de minage alimentée sur secteur : elle n'a ni batterie
# ni profil d'énergie qui aurait un sens. --performance garde lavd et son
# ordonnancement orienté latence, en laissant tous les threads disponibles.
[scx_loader]
default_sched = "scx_lavd"
default_mode = "Auto"

[scheds.scx_lavd]
auto_mode = ["--performance"]
gaming_mode = ["--performance"]
latency_mode = ["--performance"]
# Seul mode où la réduction de consommation est demandée explicitement.
powersave_mode = ["--powersave"]
