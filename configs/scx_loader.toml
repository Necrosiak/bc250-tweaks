# BC-250 — configuration de scx_loader
#
# PAS de --autopower : ce mode laisse lavd suivre le profil d'énergie du système,
# qui commande aussi la compaction de cœurs. Une BC-250 est une carte de minage
# alimentée sur secteur, sans batterie — un profil d'énergie n'y a pas de sens,
# et compacter les cœurs encore moins.
#
# ⚠️ --performance NE CORRIGE PAS les évictions du scheduler. Mesuré le
# 30/08/2026 sur kernel 7.2.1-ogc2 avec scx-scheds 1.1.3-3 : le noyau évince
# lavd (« runnable task stall », tâche non ordonnancée pendant 35 à 45 s, gel de
# toute l'interface) dans les DEUX modes — victimes relevées : winedevice.exe,
# systemd-userwork, un thread Steam. C'est pour ça que le chargement au boot
# passe par bc250-scx-start, qui se désarme si le boot précédent a subi des
# évictions. Voir configs/bc250-scx-start.sh et le README.
[scx_loader]
default_sched = "scx_lavd"
default_mode = "Auto"

[scheds.scx_lavd]
auto_mode = ["--performance"]
gaming_mode = ["--performance"]
latency_mode = ["--performance"]
# Seul mode où la réduction de consommation est demandée explicitement.
powersave_mode = ["--powersave"]
